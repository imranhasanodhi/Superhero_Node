<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Superhero</title>
</head>
<body>
  <h1>Delete Superhero</h1>
  <form id="deleteHeroForm">
    <label for="heroID">Hero ID:</label>
    <input type="number" id="heroID" name="heroID" required><br><br>
    <button type="submit">Delete Superhero</button>
  </form>
  <div id="result"></div>

  <script>
    const baseURL = 'http://localhost:3000/superheroes';

    document.getElementById('deleteHeroForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const heroID = parseInt(document.getElementById('heroID').value);

      try {
        const res = await fetch(`${baseURL}/${heroID}`, {
          method: 'DELETE',
        });

        if (!res.ok) throw new Error('Failed to delete superhero');
        document.getElementById('result').innerText = `Superhero with ID ${heroID} deleted successfully!`;
      } catch (error) {
        window.location.href = 'error.html';
      }
    });
  </script>
</body>
</html>
