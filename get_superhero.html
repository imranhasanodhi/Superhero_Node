<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Superhero</title>
</head>
<body>
  <h1>Get Superhero</h1>
  <form id="getHeroForm">
    <label for="heroID">Hero ID:</label>
    <input type="number" id="heroID" name="heroID" required><br><br>
    <button type="submit">Get Superhero</button>
  </form>
  <div id="result"></div>

  <script>
    const baseURL = 'http://localhost:3000/superheroes';

    document.getElementById('getHeroForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const heroID = parseInt(document.getElementById('heroID').value);

      try {
        const res = await fetch(`${baseURL}/${heroID}`);
        if (!res.ok) throw new Error('Superhero not found');

        const hero = await res.json();

        document.getElementById('result').innerHTML = `
          <h2>Superhero Details</h2>
          <p><strong>Hero ID:</strong> ${hero.heroID}</p>
          <p><strong>Name:</strong> ${hero.name}</p>
          <p><strong>Gear:</strong> ${hero.gear}</p>
          <p><strong>Costume:</strong> ${hero.costume}</p>
          <p><strong>Year of Birth:</strong> ${hero.yearOfBirth}</p>
        `;
      } catch (error) {
        window.location.href = 'error.html';
      }
    });
  </script>
</body>
</html>
